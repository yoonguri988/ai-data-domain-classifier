spring:
  application:
    name: back

  # spring-dotenv 가 프로젝트 루트의 .env 를 읽어 아래 ${VAR} 자리에 주입한다. (.env.example 참고)
  datasource:
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
    url: jdbc:oracle:thin:@${DB_HOST}:${DB_PORT}/${DB_SERVICE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
  jackson:
    time-zone: Asia/Seoul

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # 스키마는 03_DDL_DML_DCL_Oracle18cXE.sql 로 직접 관리하므로 애플리케이션이 스키마를 건드리지 않는다.
    properties:
      hibernate:
        format_sql: true
        default_schema: ${DB_USERNAME}
    show-sql: true

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: ${REDIS_TIMEOUT}

  config:
    import:
      - optional:application-oauth.yml
      - optional:file:.env[.properties]

  # mail:
  #   host: ${MAIL_HOST:smtp.gmail.com}
  #   port: ${MAIL_PORT:587}
  #   username: ${MAIL_USERNAME:}
  #   password: ${MAIL_PASSWORD:}
  #   properties:
  #     mail.smtp.auth: true
  #     mail.smtp.starttls.enable: true

server:
  port: ${SERVER_PORT}

# JWT 설정 - JwtProvider 에서 사용
jwt:
  issuer: yoonjeong-choi
  secret: ${JWT_SECRET:CHANGE_ME_32_BYTE_MINIMUM_SECRET_KEY_FOR_HS256}
  access-token-validity-seconds: ${JWT_ACCESS_TTL} # 30분
  refresh-token-validity-seconds: ${JWT_REFRESH_TTL} # 14일


file:
  upload-dir: uploads
